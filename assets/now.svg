<svg xmlns="http://www.w3.org/2000/svg" width="840" height="388" viewBox="0 0 840 388" role="img" aria-label="Right now: running the GDG on Campus Sakarya season, polishing timucin.site, taking freelance builds, final year of Software Engineering.">
<defs>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity=".07"/></pattern>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6a33"/><stop offset="1" stop-color="#6c4cf5"/></linearGradient>
<linearGradient id="hz" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff6a33"/><stop offset="1" stop-color="#6c4cf5"/></linearGradient>
<style>
@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes dash{to{stroke-dashoffset:-240}}
.dash{animation:dash 14s linear infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.blink{animation:blink 1.4s steps(2) infinite}
@keyframes stripes{to{transform:translateX(16px)}}
.stripes{animation:stripes .8s linear infinite}
</style>
</defs>
