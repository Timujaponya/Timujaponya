<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Arda Timuçin Acar · Product &amp; Game Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a1f"/>
      <stop offset=".55" stop-color="#c2452f"/>
      <stop offset="1" stop-color="#6c4cf5"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".85"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#fff" fill-opacity=".16"/>
    </pattern>
    <clipPath id="clip"><path d="M0 0H1200V236C1050 284 900 214 740 246S420 300 260 262 60 236 0 252Z"/></clipPath>
    <style>
      .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff}
      .m{font-family:Consolas,'SFMono-Regular',Menlo,monospace;fill:#fff}
      .dash{stroke-dasharray:2 12;animation:d 18s linear infinite}
      @keyframes d{to{stroke-dashoffset:-420}}
      .px{transform-box:fill-box;transform-origin:center;animation:b 6s ease-in-out infinite}
      @keyframes b{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(45deg)}}
      .pulse{transform-box:fill-box;transform-origin:center;animation:p 2.2s ease-out infinite}
      @keyframes p{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>

    <!-- MVP to LIVE journey -->
    <path id="j" d="M690 270 C 760 230, 800 120, 880 130 S 980 230, 1040 170 S 1090 60, 1150 70" fill="none" stroke="url(#line)" stroke-width="2.5" stroke-linecap="round" class="dash"/>
    <circle cx="880" cy="130" r="7" fill="#ff5a1f" stroke="#fff" stroke-width="2.5"/>
    <text x="866" y="112" class="m" font-size="13" letter-spacing="2">MVP</text>
    <circle cx="1150" cy="70" r="8" fill="none" stroke="#fff" stroke-width="2" class="pulse"/>
    <circle cx="1150" cy="70" r="8" fill="#6c4cf5" stroke="#fff" stroke-width="3"/>
    <text x="1132" y="52" class="m" font-size="13" letter-spacing="2" text-anchor="end">LIVE</text>
    <circle r="5" fill="#fff"><animateMotion dur="9s" repeatCount="indefinite"><mpath href="#j"/></animateMotion></circle>

    <rect class="px" x="640" y="60" width="12" height="12" rx="2" fill="#fff" fill-opacity=".85"/>
    <rect class="px" x="1000" y="250" width="10" height="10" rx="2" fill="#b8f34a" style="animation-delay:-2s"/>
    <rect class="px" x="760" y="40" width="8" height="8" rx="1" fill="#ffd2c2" style="animation-delay:-4s"/>
    <rect class="px" x="1100" y="190" width="9" height="9" rx="2" fill="#fff" fill-opacity=".7" style="animation-delay:-3s"/>
  </g>

  <text x="64" y="112" class="m" font-size="15" letter-spacing="3" fill-opacity=".85">HI, I'M</text>
  <text x="60" y="170" class="t" font-size="58" font-weight="700" letter-spacing="-1">Arda Timuçin Acar</text>
  <text x="64" y="212" class="t" font-size="24" font-weight="500" fill-opacity=".92">Product &amp; Game Developer</text>
</svg>
